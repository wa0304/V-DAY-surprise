<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Valentine's Day</title>
    <style>
        body {
            background-color: #ffccd5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }
        .message {
            font-size: 20px;
            color: #b3005e;
            font-weight: bold;
            max-width: 80%;
            padding: 20px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            opacity: 0;
            animation: fadeIn 3s ease-in-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .heart {
            position: absolute;
            width: 20px;
            height: 20px;
            background-color: red;
            transform: rotate(-45deg);
            animation: floatUp 5s infinite ease-in-out;
        }
        .heart::before,
        .heart::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            background-color: red;
            border-radius: 50%;
        }
        .heart::before { top: -10px; left: 0; }
        .heart::after { left: 10px; top: 0; }
        @keyframes floatUp {
            from { transform: translateY(100vh) rotate(-45deg); }
            to { transform: translateY(-10vh) rotate(-45deg); }
        }
    </style>
</head>
<body>
<div class="message" id="message"></div>
<script>
    const messageText = "Happy Valentine's Day my love!! The memories, moments, laughs & love we have shared since I have met you have been nothing but a pleasure, and I am grateful for having a truly amazing soul by my side during my days ❤️. Thank you for every meal, movie, joke, song, shower, dinner, and gifts you have given me over our time together. Each and every single moment is appreciated!! Proud to call you mine!!! I wish you the happiest of Valentine’s Days today my luv (I svurrrr)... let's binge eat some chocolate ASAP. Love, Wafi ❤️";
    let i = 0;
    function typeWriter() {
        if (i < messageText.length) {
            document.getElementById("message").innerHTML += messageText.charAt(i);
            i++;
            setTimeout(typeWriter, 50);
        }
    }
    setTimeout(typeWriter, 1000);

    function createHeart() {
        const heart = document.createElement("div");
        heart.classList.add("heart");
        document.body.appendChild(heart);
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.animationDuration = (Math.random() * 3 + 2) + "s";
        setTimeout(() => { heart.remove(); }, 5000);
    }
    setInterval(createHeart, 500);
</script>
</body>
</html>
